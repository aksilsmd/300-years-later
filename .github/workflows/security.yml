name: Security
# EN — Secret scanning, static analysis, web baseline scan. No telemetry sent.
# FR — Recherche de secrets, analyse statique, scan web. Aucune télémétrie envoyée.
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: "0 4 * * 1" }]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --no-banner --redact --exit-code 1

  sast:
    name: Static analysis (semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install semgrep
      - name: Full scan → SARIF (reported in the Security tab, never silently dropped)
        run: semgrep --config p/default --metrics=off --sarif --output semgrep.sarif --exclude docs --exclude legal || true
      - uses: github/codeql-action/upload-sarif@v4
        with: { sarif_file: semgrep.sarif, category: semgrep }
      - name: Blocking gate (high-confidence rules only)
        run: |
          semgrep --config p/ci --metrics=off --json --output ci.json --exclude docs --exclude legal || true
          python3 - <<'PY'
          import json, sys
          d = json.load(open("ci.json"))
          res, errs = d.get("results", []), d.get("errors", [])
          for r in res:
              print(f"::error file={r['path']},line={r['start']['line']}::{r['check_id']} — {r['extra']['message'][:180]}")
          for e in errs:
              print(f"::warning::semgrep error: {str(e)[:180]}")
          print(f"::notice::{len(res)} finding(s), {len(errs)} scan error(s)")
          sys.exit(1 if res else 0)
          PY

  web-baseline:
    name: OWASP ZAP baseline (reference landing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Serve the reference landing
        run: cd marketing/landing && python3 -m http.server 8080 &
      - uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://localhost:8080"
          allow_issue_writing: false
