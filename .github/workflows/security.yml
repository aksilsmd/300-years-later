name: Security
# EN — Secret scanning, static analysis, web baseline scan. No telemetry sent.
# FR — Recherche de secrets, analyse statique, scan web. Aucune télémétrie envoyée.
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: "0 4 * * 1" }]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --no-banner --redact --exit-code 1

  sast:
    name: Static analysis (semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install semgrep
      - name: semgrep
        run: semgrep --config p/default --metrics=off --severity ERROR --error --exclude docs --exclude legal

  web-baseline:
    name: OWASP ZAP baseline (reference landing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Serve the reference landing
        run: cd marketing/landing && python3 -m http.server 8080 &
      - uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://localhost:8080"
          allow_issue_writing: false
