name: Sécurité
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: "0 4 * * 1" }]
permissions:
  contents: read
jobs:
  secrets-and-sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks (secrets dans tout l'historique)
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - name: semgrep (analyse statique)
        run: pip install semgrep && semgrep --config p/default --error --exclude docs --exclude legal
  zap-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Servir la landing de référence
        run: cd marketing/landing && python3 -m http.server 8080 &
      - name: OWASP ZAP baseline
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://localhost:8080"
          allow_issue_writing: false
