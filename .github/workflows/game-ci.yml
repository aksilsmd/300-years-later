name: Jeu Unreal (runner Windows auto-hébergé)
# Nécessite un runner Windows auto-hébergé avec Unreal Engine 5.8, Visual Studio 2022 et la variable UE_ROOT.
# S'active automatiquement dès que le projet existe dans game/.
on:
  push: { branches: [main], paths: ["game/**", "data/**"] }
  pull_request: { paths: ["game/**", "data/**"] }
permissions:
  contents: read
jobs:
  build-and-test:
    if: ${{ hashFiles('game/*.uproject') != '' }}
    runs-on: [self-hosted, windows, unreal]
    steps:
      - uses: actions/checkout@v4
        with: { lfs: false }
      - name: Compiler l'éditeur
        shell: cmd
        run: '"%UE_ROOT%\Engine\Build\BatchFiles\Build.bat" TemporalValleyEditor Win64 Development -Project="%CD%\game\TemporalValley.uproject" -WaitMutex'
      - name: Tests Automation (cœur temporel)
        shell: cmd
        run: '"%UE_ROOT%\Engine\Binaries\Win64\UnrealEditor-Cmd.exe" "%CD%\game\TemporalValley.uproject" -ExecCmds="Automation RunTests TemporalCore;Quit" -unattended -nullrhi -nosplash -log -ReportExportPath="%CD%\build\automation"'
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: automation-report, path: build/automation }
