name: Deploy landing (manual)
# EN — Manual only, after the human approved the copy and the media.
# FR — Déclenché uniquement à la main, après validation humaine des textes et des médias.
on: workflow_dispatch
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22 }
      - working-directory: marketing/landing-react
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build
      - run: python3 tools/privacy_scan.py
      - run: python3 tools/check_media_approvals.py
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: marketing/landing-react/dist }
      - id: d
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
