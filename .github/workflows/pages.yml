name: Deploy landing (manual)
# EN — Manual only, after the human approved the copy and the media.
# FR — Déclenché uniquement à la main, après validation humaine des textes et des médias.
on: workflow_dispatch
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - working-directory: marketing/landing-react
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build
      - run: python3 tools/privacy_scan.py
      - run: python3 tools/check_media_approvals.py
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with: { path: marketing/landing-react/dist }
      - id: d
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
