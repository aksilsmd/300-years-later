name: CI
# EN — Data, privacy, licences, media approvals, landing tests, builds.
# FR — Données, confidentialité, licences, validation des médias, tests de la landing, builds.
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kit:
    name: Kit checks (data, privacy, licences, media)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install jsonschema
      - name: Game data (schemas, recipes, contracts)
        run: python3 tools/validate_data.py
      - name: Privacy (personal data, secrets, trackers)
        run: python3 tools/privacy_scan.py
      - name: Licences
        run: python3 tools/license_audit.py
      - name: Landing media approved in media/APPROVALS.md
        run: python3 tools/check_media_approvals.py
      - name: No licensed Unreal content in the public repo
        run: |
          if git ls-files | grep -Ei '\.(uasset|umap|pak)$|^game/Content/'; then
            echo "::error::Unreal binary content must stay in the private repo"; exit 1
          fi

  landing:
    name: Landing page (Playwright + Robot Framework)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install pytest playwright robotframework robotframework-browser
      - name: Playwright tests (reference landing)
        run: |
          python -m playwright install --with-deps chromium
          python -m pytest tests/web -q
      - name: Robot Framework end-to-end tests
        run: |
          rfbrowser init chromium
          robot --outputdir results tests/robot
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: robot-results, path: results }

  build-landing:
    name: Build React landing
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: marketing/landing-react } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run build
      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        with: { name: landing-dist, path: marketing/landing-react/dist }

  build-video:
    name: Typecheck Remotion project
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: marketing/video } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npx tsc --noEmit
