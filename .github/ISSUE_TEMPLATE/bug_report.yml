name: 🐞 Bug report / Rapport d'anomalie
description: Something in the kit is broken — a tool, a skill, a test, a guide.
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: "Write in English or French. **Remove any personal data** from logs and screenshots first (handles, paths containing your name)."
  - type: textarea
    id: summary
    attributes: { label: "Summary / Résumé (one sentence)" }
    validations: { required: true }
  - type: dropdown
    id: severity
    attributes:
      label: Severity / Sévérité
      options:
        - "S1 — crash, desync, data loss, compliance"
        - "S2 — a feature is broken"
        - "S3 — annoying but workable"
        - "S4 — cosmetic"
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Étapes pour reproduire
      value: "1.\n2.\n3."
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: "Expected / Attendu (quote the design document §)" }
  - type: textarea
    id: actual
    attributes: { label: "Actual / Obtenu" }
    validations: { required: true }
  - type: textarea
    id: env
    attributes:
      label: Environment / Environnement
      description: "Output of `python3 tools/doctor.py` is ideal."
      render: shell
  - type: dropdown
    id: frequency
    attributes:
      label: Frequency / Fréquence
      options: ["always / toujours", "often / souvent", "rare (x/10)"]
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: "No personal data in what I pasted / Aucune donnée personnelle dans ce que j'ai collé"
          required: true
