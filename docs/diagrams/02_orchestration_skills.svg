<style>text{font-family:Georgia,"Times New Roman",serif} text:not([fill]){fill:#2a1a0e} .s{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif} text.m{fill:#6b5a4c}</style>
<rect width="1240" height="660" fill="#fbf6ee"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a1a0e"/></marker></defs><text x="40" y="50" font-size="28" text-anchor="start" class="" font-weight="700">Les skills : un studio en équipes</text><text x="40" y="78" font-size="15" text-anchor="start" class="s m" font-weight="400">game-studio dirige ; chaque équipe a son skill ; privacy-guard contrôle tout ce qui sort.</text><rect x="470" y="105" width="300" height="80" rx="10" fill="#2a1a0e" stroke="#2a1a0e" stroke-width="2"/><text x="620" y="140" font-size="22" text-anchor="middle" class="" font-weight="700" fill="#fbf6ee">game-studio</text><text x="620" y="165" font-size="13" text-anchor="middle" class="s" font-weight="400" fill="#e9dccb">direction, portes, état du projet</text><rect x="40" y="260" width="180" height="96" rx="10" fill="#f3d9b1" stroke="#2a1a0e" stroke-width="2"/><text x="130" y="300" font-size="16" text-anchor="middle" class="s" font-weight="700">studio-setup</text><text x="130" y="326" font-size="12" text-anchor="middle" class="s m" font-weight="400">installation, matériel, MCP</text><line x1="620" y1="185" x2="130" y2="256" stroke="#2a1a0e" stroke-width="2" marker-end="url(#a)"/><rect x="240" y="260" width="180" height="96" rx="10" fill="#e8eef0" stroke="#2a1a0e" stroke-width="2"/><text x="330" y="300" font-size="16" text-anchor="middle" class="s" font-weight="700">game-build</text><text x="330" y="326" font-size="12" text-anchor="middle" class="s m" font-weight="400">code Unreal C++ par phases</text><line x1="620" y1="185" x2="330" y2="256" stroke="#2a1a0e" stroke-width="2" marker-end="url(#a)"/><rect x="440" y="260" width="180" height="96" rx="10" fill="#e9c9b3" stroke="#2a1a0e" stroke-width="2"/><text x="530" y="300" font-size="16" text-anchor="middle" class="s" font-weight="700">game-assets</text><text x="530" y="326" font-size="12" text-anchor="middle" class="s m" font-weight="400">monde, PCG, MetaHuman</text><line x1="620" y1="185" x2="530" y2="256" stroke="#2a1a0e" stroke-width="2" marker-end="url(#a)"/><rect x="640" y="260" width="180" height="96" rx="10" fill="#d9d6f5" stroke="#2a1a0e" stroke-width="2"/><text x="730" y="300" font-size="16" text-anchor="middle" class="s" font-weight="700">game-qa</text><text x="730" y="326" font-size="12" text-anchor="middle" class="s m" font-weight="400">tests, charge, sécurité</text><line x1="620" y1="185" x2="730" y2="256" stroke="#2a1a0e" stroke-width="2" marker-end="url(#a)"/><rect x="840" y="260" width="180" height="96" rx="10" fill="#f3d9b1" stroke="#2a1a0e" stroke-width="2"/><text x="930" y="300" font-size="16" text-anchor="middle" class="s" font-weight="700">legal-compliance</text><text x="930" y="326" font-size="12" text-anchor="middle" class="s m" font-weight="400">corpus juridique legal/</text><line x1="620" y1="185" x2="930" y2="256" stroke="#2a1a0e" stroke-width="2" marker-end="url(#a)"/><rect x="1040" y="260" width="180" height="96" rx="10" fill="#e8eef0" stroke="#2a1a0e" stroke-width="2"/><text x="1130" y="300" font-size="16" text-anchor="middle" class="s" font-weight="700">marketing-launch</text><text x="1130" y="326" font-size="12" text-anchor="middle" class="s m" font-weight="400">rendus, trailer, landing</text><line x1="620" y1="185" x2="1130" y2="256" stroke="#2a1a0e" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="420" width="1160" height="70" rx="10" fill="#fbe3d4" stroke="#b5541c" stroke-width="2"/><text x="620" y="452" font-size="18" text-anchor="middle" class="s" font-weight="700">privacy-guard — avant tout commit, export ou publication</text><text x="620" y="476" font-size="13" text-anchor="middle" class="s m" font-weight="400">données personnelles · secrets · traceurs · assets sous licence · identité Git anonyme</text><line x1="130" y1="356" x2="130" y2="416" stroke="#2a1a0e" stroke-width="2" marker-end="url(#a)"/><line x1="330" y1="356" x2="330" y2="416" stroke="#2a1a0e" stroke-width="2" marker-end="url(#a)"/><line x1="530" y1="356" x2="530" y2="416" stroke="#2a1a0e" stroke-width="2" marker-end="url(#a)"/><line x1="730" y1="356" x2="730" y2="416" stroke="#2a1a0e" stroke-width="2" marker-end="url(#a)"/><line x1="930" y1="356" x2="930" y2="416" stroke="#2a1a0e" stroke-width="2" marker-end="url(#a)"/><line x1="1130" y1="356" x2="1130" y2="416" stroke="#2a1a0e" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="530" width="560" height="90" rx="10" fill="#ffffff" stroke="#2a1a0e" stroke-width="2"/><text x="60" y="565" font-size="20" text-anchor="" class="" font-weight="700">Vous</text><text x="60" y="592" font-size="14" text-anchor="s m" class="s" font-weight="400">titre, prix, achats, publication, validation des médias,</text><text x="60" y="612" font-size="14" text-anchor="s m" class="s" font-weight="400">playtests, décisions aux portes</text><rect x="640" y="530" width="560" height="90" rx="10" fill="#ffffff" stroke="#2a1a0e" stroke-width="2"/><text x="660" y="565" font-size="20" text-anchor="" class="" font-weight="700">Professionnels</text><text x="660" y="592" font-size="14" text-anchor="s m" class="s" font-weight="400">juriste, artistes (créatures, capsule), compositeur,</text><text x="660" y="612" font-size="14" text-anchor="s m" class="s" font-weight="400">comédiens, traducteurs</text>
