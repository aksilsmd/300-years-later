395" font-size="14" text-anchor="" class="s" font-weight="700">Dangers</text><text x="359" y="415" font-size="12" text-anchor="" class="s m" font-weight="400">StateTree</text><rect x="630" y="371" width="270" height="56" rx="8" fill="#ffffff" stroke="#2a1a0e" stroke-width="2"/><text x="644" y="395" font-size="14" text-anchor="" class="s" font-weight="700">Voix Steam</text><text x="644" y="415" font-size="12" text-anchor="" class="s m" font-weight="400">filtres inter-époques</text><rect x="915" y="371" width="270" height="56" rx="8" fill="#ffffff" stroke="#2a1a0e" stroke-width="2"/><text x="929" y="395" font-size="14" text-anchor="" class="s" font-weight="700">UI Common UI</text><text x="929" y="415" font-size="12" text-anchor="" class="s m" font-weight="400">HUD, accessibilité</text><line x1="620" y1="448" x2="620" y2="484" stroke="#2a1a0e" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="488" width="560" height="110" rx="10" fill="#e9c9b3" stroke="#2a1a0e" stroke-width="2"/><text x="60" y="520" font-size="18" text-anchor="" class="" font-weight="700">Données publiques (data/)</text><text x="60" y="546" font-size="14" text-anchor="s m" class="s" font-weight="400">recettes · contrats · réglages · phrases · shotlist</text><text x="60" y="570" font-size="14" text-anchor="s m" class="s" font-weight="400">validées par schéma, copiées dans le build</text><rect x="640" y="488" width="560" height="110" rx="10" fill="#d9d6f5" stroke="#2a1a0e" stroke-width="2"/><text x="660" y="520" font-size="18" text-anchor="" class="" font-weight="700">Contenu binaire (dépôt PRIVÉ)</text><text x="660" y="546" font-size="14" text-anchor="s m" class="s" font-weight="400">Content/ : assets Fab, MetaHumans, cartes</text><text x="660" y="570" font-size="14" text-anchor="s m" class="s" font-weight="400">jamais publié (licences Epic/Fab/MetaHuman)</text>
