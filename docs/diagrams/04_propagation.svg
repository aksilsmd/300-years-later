<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 470" width="1240" height="470" role="img" aria-label="Propagation d'une action à travers les époques">
<title>Propagation d'une action à travers les époques</title>
<style>text{font-family:Georgia,"Times New Roman",serif} text:not([fill]){fill:#2a1a0e} .s{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif} text.m{fill:#6b5a4c}</style>
<rect width="1240" height="470" fill="#fbf6ee"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a1a0e"/></marker></defs><text x="40" y="50" font-size="28" text-anchor="start" class="" font-weight="700">Ce qui se passe quand un joueur plante une graine</text><rect x="40" y="100" width="215" height="90" rx="10" fill="#ffffff" stroke="#2a1a0e" stroke-width="2"/><text x="147" y="138" font-size="17" text-anchor="middle" class="s" font-weight="700">Joueur (an 0)</text><text x="147" y="164" font-size="13" text-anchor="middle" class="s m" font-weight="400">appuie sur Planter</text><line x1="255" y1="145" x2="278" y2="145" stroke="#2a1a0e" stroke-width="2" marker-end="url(#a)"/><rect x="280" y="100" width="215" height="90" rx="10" fill="#ffffff" stroke="#2a1a0e" stroke-width="2"/><text x="387" y="138" font-size="17" text-anchor="middle" class="s" font-weight="700">Requête</text><text x="387" y="164" font-size="13" text-anchor="middle" class="s m" font-weight="400">envoyée à l'hôte</text><line x1="495" y1="145" x2="518" y2="145" stroke="#2a1a0e" stroke-width="2" marker-end="url(#a)"/><rect x="520" y="100" width="215" height="90" rx="10" fill="#ffffff" stroke="#2a1a0e" stroke-width="2"/><text x="627" y="138" font-size="17" text-anchor="middle" class="s" font-weight="700">Hôte</text><text x="627" y="164" font-size="13" text-anchor="middle" class="s m" font-weight="400">vérifie portée, outil, cadence</text><line x1="735" y1="145" x2="758" y2="145" stroke="#2a1a0e" stroke-width="2" marker-end="url(#a)"/><rect x="760" y="100" width="215" height="90" rx="10" fill="#ffffff" stroke="#2a1a0e" stroke-width="2"/><text x="867" y="138" font-size="17" text-anchor="middle" class="s" font-weight="700">Journal</text><text x="867" y="164" font-size="13" text-anchor="middle" class="s m" font-weight="400">ajoute l'action, la diffuse</text><line x1="975" y1="145" x2="998" y2="145" stroke="#2a1a0e" stroke-width="2" marker-end="url(#a)"/><rect x="1000" y="100" width="215" height="90" rx="10" fill="#ffffff" stroke="#2a1a0e" stroke-width="2"/><text x="1107" y="138" font-size="17" text-anchor="middle" class="s" font-weight="700">Chaque PC</text><text x="1107" y="164" font-size="13" text-anchor="middle" class="s m" font-weight="400">rejoue la recette, même résultat</text><rect x="40" y="250" width="270" height="110" rx="10" fill="#f3d9b1" stroke="#b5541c" stroke-width="3"/><text x="60" y="292" font-size="26" text-anchor="" class="" font-weight="800" fill="#b5541c">an 0</text><text x="60" y="330" font-size="20" text-anchor="" class="s" font-weight="600">graine</text><line x1="310" y1="305" x2="333" y2="305" stroke="#2a1a0e" stroke-width="2" marker-end="url(#a)"/><rect x="335" y="250" width="270" height="110" rx="10" fill="#e8eef0" stroke="#9d7a12" stroke-width="3"/><text x="355" y="292" font-size="26" text-anchor="" class="" font-weight="800" fill="#9d7a12">an 300</text><text x="355" y="330" font-size="20" text-anchor="" class="s" font-weight="600">chêne</text><line x1="605" y1="305" x2="628" y2="305" stroke="#2a1a0e" stroke-width="2" marker-end="url(#a)"/><rect x="630" y="250" width="270" height="110" rx="10" fill="#e9c9b3" stroke="#a8572c" stroke-width="3"/><text x="650" y="292" font-size="26" text-anchor="" class="" font-weight="800" fill="#a8572c">an 600</text><text x="650" y="330" font-size="20" text-anchor="" class="s" font-weight="600">grand chêne</text><line x1="900" y1="305" x2="923" y2="305" stroke="#2a1a0e" stroke-width="2" marker-end="url(#a)"/><rect x="925" y="250" width="270" height="110" rx="10" fill="#d9d6f5" stroke="#3f3aa8" stroke-width="3"/><text x="945" y="292" font-size="26" text-anchor="" class="" font-weight="800" fill="#3f3aa8">an 900</text><text x="945" y="330" font-size="20" text-anchor="" class="s" font-weight="600">arbre millénaire</text><text x="40" y="410" font-size="15" text-anchor="" class="s m" font-weight="400">La graine de monde + le journal + les recettes suffisent à reconstruire les 4 époques : sauvegarde, capsule et musée utilisent le même journal.</text><text x="40" y="436" font-size="15" text-anchor="" class="s m" font-weight="400">Si l'an 300 avait modifié l'arbre et que l'an 0 arrache la graine : non-conformité, la jauge monte, les Chronomites arrivent.</text>
</svg>