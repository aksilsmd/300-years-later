<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 580" width="1240" height="580" role="img" aria-label="Modèle de sécurité du kit">
<title>Modèle de sécurité du kit</title>
<style>text{font-family:Georgia,"Times New Roman",serif} text:not([fill]){fill:#2a1a0e} .s{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif} text.m{fill:#6b5a4c}</style>
<rect width="1240" height="580" fill="#fbf6ee"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a1a0e"/></marker></defs><text x="40" y="50" font-size="28" text-anchor="start" class="" font-weight="700">Modèle de sécurité du kit</text><rect x="40" y="90" width="560" height="360" rx="10" fill="#eef5ea" stroke="#3d7a45" stroke-width="2"/><text x="60" y="126" font-size="22" text-anchor="" class="" font-weight="700" fill="#2f6a38">L'IA peut</text><text x="70" y="170" font-size="16" text-anchor="" class="s" font-weight="400">✓  lire et écrire dans le dépôt</text><text x="70" y="222" font-size="16" text-anchor="" class="s" font-weight="400">✓  installer depuis les sources officielles, après accord</text><text x="70" y="274" font-size="16" text-anchor="" class="s" font-weight="400">✓  compiler, tester, mesurer</text><text x="70" y="326" font-size="16" text-anchor="" class="s" font-weight="400">✓  piloter l'éditeur Unreal sur une branche</text><text x="70" y="378" font-size="16" text-anchor="" class="s" font-weight="400">✓  préparer documents, médias, landing page</text><text x="70" y="430" font-size="16" text-anchor="" class="s" font-weight="400">✓  proposer achats, textes et décisions</text><rect x="640" y="90" width="560" height="360" rx="10" fill="#fbe8e4" stroke="#a8342a" stroke-width="2"/><text x="660" y="126" font-size="22" text-anchor="" class="" font-weight="700" fill="#8c2a22">L'IA ne fait jamais seule</text><text x="670" y="170" font-size="16" text-anchor="" class="s" font-weight="400">✗  acheter, créer un compte, saisir un identifiant</text><text x="670" y="222" font-size="16" text-anchor="" class="s" font-weight="400">✗  publier (GitHub public, Steam, réseaux, site)</text><text x="670" y="274" font-size="16" text-anchor="" class="s" font-weight="400">✗  signer, déposer une marque, fixer le prix</text><text x="670" y="326" font-size="16" text-anchor="" class="s" font-weight="400">✗  lire ~/.ssh, .env, trousseaux, fichiers perso</text><text x="670" y="378" font-size="16" text-anchor="" class="s" font-weight="400">✗  ajouter traceur, cookie, CDN, télémétrie</text><text x="670" y="430" font-size="16" text-anchor="" class="s" font-weight="400">✗  publier Content/ ou des assets sous licence</text><rect x="40" y="480" width="1160" height="70" rx="10" fill="#ffffff" stroke="#2a1a0e" stroke-width="2"/><text x="620" y="512" font-size="14" text-anchor="middle" class="s" font-weight="600">Garde-fous : .claude/settings.json (deny/ask) · tools/privacy_scan.py · hook pré-commit · CI (gitleaks, semgrep, ZAP) · media/APPROVALS.md</text><text x="620" y="536" font-size="13" text-anchor="middle" class="s m" font-weight="400">Votre liste locale de termes interdits (~/.config/300yl/denylist.txt) n'est jamais versionnée.</text>
</svg>