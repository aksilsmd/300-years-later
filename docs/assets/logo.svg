<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Afterloom">
  <title>Afterloom</title>
  <desc>Une carotte stratigraphique : quatre strates de 300 ans, et une trace qui grossit en descendant.</desc>
  <rect width="64" height="64" rx="8" fill="#E3E1D9"/>
  <g>
    <rect y="0"  width="64" height="16" fill="#DFE2D2"/>
    <rect y="16" width="64" height="16" fill="#E3DCC4"/>
    <rect y="32" width="64" height="16" fill="#D9DADB"/>
    <rect y="48" width="64" height="16" fill="#CFDED9"/>
  </g>
  <g>
    <circle cx="18" cy="8"  r="1.6" fill="#76875A"/>
    <circle cx="18" cy="24" r="3.4" fill="#8A6B1E"/>
    <circle cx="18" cy="40" r="5.6" fill="#4E5257"/>
    <circle cx="18" cy="56" r="8"   fill="#1C6F62"/>
  </g>
  <g stroke="#15191A" stroke-opacity=".28" stroke-width="1">
    <path d="M0 16h64M0 32h64M0 48h64"/>
  </g>
  <rect x=".5" y=".5" width="63" height="63" rx="7.5" fill="none" stroke="#15191A" stroke-opacity=".35"/>
</svg>
